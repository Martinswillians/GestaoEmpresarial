 if(c.plan==='Mensal'){const f=new Date(st);for(let i=0;i<7&&!days.includes(f.getDay());i++)f.setDate(f.getDate()+1);
  const n=Math.min(4,Math.ceil(f.getDate()/7)),wd=f.getDay();

  return fin(out)}
 const step=c.plan==='Quinzenal'?2:1,ws=new Date(wkS(c.cStart)+'T12:00');
 for(let d=new Date(st);d<en;d.setDate(d.getDate()+1)){const w=Math.floor(Math.round((d-ws)/864e5)/7);if(days.includes(d.getDay())&&w%step===0)out.push(ymd(d))}
