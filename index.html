<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Gestão Empresarial</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6b2a6f;--p2:#4d1e51;--pl:#6b2a6f;--t:#7aa5b8;--k:#d79bb4;--bg:#f7f2f8;--card:#fff;--tx:#2a2030;--mu:#6f6577;--bd:#e5dbe7;--ok:#2e7d4f;--er:#b83a2e}
@media(prefers-color-scheme:dark){:root{--pl:#e3adc6;--bg:#171119;--card:#221a25;--tx:#f1eaf3;--mu:#a99bb0;--bd:#3a2d3e;--ok:#5cc58a;--er:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
h1,h3{font-family:Fraunces,Georgia,serif;margin:0 0 8px}
.wk{display:flex;flex-wrap:wrap;gap:4px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--mu);font-size:12px}
.cal button{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.cal .td{border-color:var(--pl);font-weight:700}.cal .sel{background:var(--p);color:#fff;border-color:var(--p)}
.cal i{width:6px;height:6px;border-radius:50%;background:var(--k);display:block;margin-top:2px}
button{font:inherit;cursor:pointer}
.card,.ann{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.ann{border-left:5px solid var(--t)}.ann.alerta{border-left-color:#e0a100}.ann.publicidade{border-left-color:var(--k)}
.ann p{margin:4px 0 0;white-space:pre-line}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{display:block;color:var(--mu)}
.tag{font-size:12px;background:var(--bd);border-radius:20px;padding:2px 9px}.tag.ok{color:var(--ok)}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.ghost{background:none;border:1px solid var(--bd);color:inherit;border-radius:10px;padding:8px 12px}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.acts button{border:0;background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
fieldset{border:1px solid var(--bd);border-radius:10px;margin:10px 0}legend{color:var(--mu);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx)}.chk input{width:auto;margin:0}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .btn,.sheet .ghost{flex:1}.sheet .end{display:flex;gap:8px;margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpis div{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--mu)}.kpis b{display:block;font-size:16px;color:var(--tx)}
.auth{max-width:420px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px}
.brand{margin-bottom:16px}.brand h1{font-size:28px;color:var(--pl)}.brand p{margin:0;color:var(--mu)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border:1px solid var(--bd);background:none;border-radius:10px;color:var(--tx)}.seg .on{background:var(--p);color:#fff;border-color:var(--p)}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}.bar input{width:auto;margin:0}
.receita{color:var(--ok)}.despesa{color:var(--er)}.err{color:var(--er);min-height:1em}.mu{color:var(--mu)}
a{color:var(--pl)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%}#toast.show{opacity:1}
.shell{display:grid;grid-template-rows:auto 1fr;grid-template-columns:240px 1fr;height:100vh;height:100dvh;overflow:hidden}
.shell.col{grid-template-columns:1fr}.shell.col .side{display:none}
.top{grid-column:1/-1;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 12px 0 8px;min-height:56px;border-bottom:3px solid var(--k);z-index:5}
.tl,.tr{display:flex;align-items:center;gap:10px;min-width:0}.tt{font:700 18px Fraunces,Georgia,serif;white-space:nowrap}
.un{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.menu-btn,.pw{background:none;border:0;color:#fff;padding:10px;border-radius:8px;display:flex}.menu-btn{flex-direction:column;gap:5px}.menu-btn i{display:block;width:22px;height:3px;background:#fff;border-radius:2px}
.menu-btn:hover,.pw:hover{background:#fff2}
.side{background:var(--card);border-right:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column}
.sh{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;border-bottom:1px solid var(--bd)}
.av{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font:700 18px Fraunces,Georgia,serif;flex:none}
.sn{font-weight:600;font-size:14px;word-break:break-word}.sr{font-size:12px;color:var(--mu)}
.side ul{list-style:none;margin:0;padding:10px 8px;flex:1}
.side li button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;color:var(--mu);font-weight:500;font-size:14px}
.side li button:hover,.side li .on{background:var(--bg);color:var(--pl)}.side li .on{font-weight:700}
.sf{padding:14px;border-top:1px solid var(--bd)}.sf button{width:100%}
.ovl{display:none}
.shell main{overflow-y:auto;padding:20px;min-width:0}.mi{max-width:1100px;margin:0 auto}
.kpis{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.dash,.split{display:grid;gap:12px}.dash .card{margin:0}
#toast{bottom:calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
@media(min-width:900px){.dash{grid-template-columns:1fr 1fr;align-items:start}.dash .full{grid-column:1/-1;order:-1}.split{grid-template-columns:minmax(320px,420px) 1fr;align-items:start}}
@media(max-width:899px){.shell{grid-template-columns:1fr}.shell main{padding:14px}.dash .full{order:-1}
.side,.shell.col .side{display:flex;position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);z-index:200;transform:translateX(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top)}
.side.open{transform:none}.ovl.on{display:block;position:fixed;inset:0;background:#0007;z-index:150}}
@media(max-width:480px){.un{display:none}}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 12px}
.sw.on{border-color:var(--pl);outline:2px solid var(--pl)}
.sw span{width:16px;height:16px;border-radius:50%;margin-right:-4px;border:1px solid #0003}
.lg{display:block;max-height:64px;max-width:200px;margin:6px 0 10px;border-radius:8px;background:#fff}
.avl{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.nb{background:#e07b00;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:auto}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyD2sGz7nS2TxLQPSRcl0GpCY22O5DCxI-A",
  authDomain:"gestaoempresarial-41a31.firebaseapp.com",
  projectId:"gestaoempresarial-41a31",
  storageBucket:"gestaoempresarial-41a31.firebasestorage.app",
  messagingSenderId:"102727456743",
  appId:"1:102727456743:web:5aa4cf5151df18fda70f42"
});
const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=s=>document.querySelector(s);
let U=null,CO=null,isAdmin=false,tab='home',reg=false,mode='login',subs=[];
const D={employees:[],clients:[],appts:[],tx:[],services:[],reqs:[],users:[],ann:[],cos:[]};
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const dbr=s=>s?s.split('-').reverse().join('/'):'';
const today=()=>ymd(new Date());
let mon=today().slice(0,7);
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2800)};
const col=k=>k==='ann'?db.collection('announcements'):k==='users'?db.collection('invites'):db.collection(`companies/${CID}/${k==='reqs'?'requests':k}`);
const sum=(t,ty)=>t.filter(x=>x.type===ty).reduce((s,x)=>s+(+x.amount||0),0);
const cmpA=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const endT=(t,h)=>{const m=(+t.slice(0,2))*60+(+t.slice(3,5))+Math.round(h*60);return p2(Math.floor(m/60)%24)+':'+p2(m%60)};
const nextDate=(d,f)=>{const x=new Date(d+'T12:00');if(f==='Semanal')x.setDate(x.getDate()+7);else if(f==='Quinzenal')x.setDate(x.getDate()+14);else if(f==='Mensal')x.setMonth(x.getMonth()+1);else return null;return ymd(x)};
const ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/email-already-in-use':'Este e-mail já está cadastrado. Use "Entrar".','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Tente novamente em alguns minutos.'};

const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const SV='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const SUN=SV+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON=SV+'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const PAL={
 ameixa:{n:'Ameixa',p:'#6b2a6f',p2:'#4d1e51',k:'#d79bb4',t:'#7aa5b8',L:['#f7f2f8','#ffffff','#e5dbe7','#2a2030','#6f6577','#6b2a6f'],D:['#171119','#221a25','#3a2d3e','#f1eaf3','#a99bb0','#e3adc6']},
 oceano:{n:'Oceano',p:'#155e86',p2:'#0f4565',k:'#6cc3d5',t:'#8fb8d6',L:['#eef5f9','#ffffff','#d6e4ec','#14232d','#5b6f7c','#155e86'],D:['#0e1820','#16232d','#263a47','#e8f1f6','#93a9b7','#7cc4e0']},
 esmeralda:{n:'Esmeralda',p:'#1f7a54',p2:'#165a3e',k:'#8fd1ae',t:'#7fb7a0',L:['#eff7f3','#ffffff','#d5e6dd','#14251d','#5a6f64','#1f7a54'],D:['#0f1a15','#17251e','#2a4034','#e8f3ed','#93aa9d','#7fd1a6']},
 rosa:{n:'Rosa',p:'#b0376f',p2:'#85274f',k:'#f0a6c5',t:'#c9a0b8',L:['#fbf1f5','#ffffff','#efd9e2','#2d1822','#7a6270','#b0376f'],D:['#1a1015','#26171e','#432a36','#f6e9ef','#b79aa8','#f0a6c5']},
 sol:{n:'Pôr do sol',p:'#c4570f',p2:'#963f08',k:'#f5b971',t:'#d9a574',L:['#fbf4ec','#ffffff','#efdfcc','#2c2015','#7a6a58','#c4570f'],D:['#1a130c','#261c12','#45331f','#f6ede2','#b9a58c','#f5b971']},
 grafite:{n:'Grafite',p:'#3f4a5c',p2:'#2d3645',k:'#9fb3c8',t:'#8aa0b5',L:['#f2f4f7','#ffffff','#dde2e9','#1d232c','#5f6b7a','#3f4a5c'],D:['#101317','#181d23','#2b333d','#e9edf2','#98a3b1','#9fb3c8']}};
let MODE=ls('gm')||'auto',PALK=ls('gp')||'ameixa';
const isDark=()=>MODE==='dark'||(MODE==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){const P=PAL[PALK]||PAL.ameixa,d=isDark(),c=d?P.D:P.L,r=document.documentElement.style;
 [['--p',P.p],['--p2',P.p2],['--k',P.k],['--t',P.t],['--bg',c[0]],['--card',c[1]],['--bd',c[2]],['--tx',c[3]],['--mu',c[4]],['--pl',c[5]],['--ok',d?'#5cc58a':'#2e7d4f'],['--er',d?'#ff8a7a':'#b83a2e']].forEach(([k,v])=>r.setProperty(k,v));r.colorScheme=d?'dark':'light'}
function persistTheme(){ls('gm',MODE);ls('gp',PALK);applyTheme();
 const i=$('#tmi');if(i)i.innerHTML=isDark()?SUN:MOON;
 document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.k===PALK));const t=$('#tsel');if(t)t.value=MODE;
 if(U&&!STAFF){CO={...CO,mode:MODE,palette:PALK};syncPublic();db.doc('companies/'+CID).set({mode:MODE,palette:PALK},{merge:true}).catch(x=>toast(x.message))}}
const toggleMode=()=>{MODE=isDark()?'light':'dark';persistTheme()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(MODE==='auto'){applyTheme();const i=$('#tmi');if(i)i.innerHTML=isDark()?SUN:MOON}});
applyTheme();

/* ---------- Esquemas dos formulários ---------- */
const DUR=[];for(let h=1;h<=10;h+=.5)DUR.push([h,h+'h']);
const SCH={
 clients:{t:'cliente',f:()=>[['name','Nome','text'],['email','E-mail (para o futuro login do cliente)','email'],['phone','Telefone / WhatsApp','tel'],['addr','Endereço','text'],['kind','Tipo de imóvel','select',['Apartamento','Casa','Sala comercial','Escritório','Outro']],['plan','Plano de limpeza','select',['Avulso','Semanal','Quinzenal','Mensal']],['days','Dias da limpeza','days'],['obs','Observações','textarea']]},
 employees:{t:'funcionário(a)',f:()=>[['name','Nome','text'],['email','E-mail (para o futuro login do profissional)','email'],['role','Função','select',['Líder','Novato(a)']],['phone','Telefone','tel'],['obs','Observações','text']]},
 appts:{t:'atendimento',def:{date:today(),time:'08:30',dur:4,freq:'Avulso'},f:()=>[['client','Cliente','select',D.clients.map(c=>[c.id,c.name])],['service','Tipo de serviço','select',[['','Selecione...'],...D.services.map(s=>[s.id,s.name])]],['date','Data','date'],['time','Início','time'],['dur','Duração do serviço','select',DUR],['emps','Equipe','emps'],['freq','Frequência','select',['Avulso','Semanal','Quinzenal','Mensal']],['price','Valor do serviço (R$)','number'],['uber','Deslocamento Uber, custo do dia (R$)','number'],['obs','Observações','textarea']]},
 tx:{t:'lançamento',def:{date:today(),type:'despesa'},f:()=>[['type','Tipo','select',[['receita','Receita'],['despesa','Despesa']]],['desc','Descrição','text'],['amount','Valor (R$)','number'],['date','Data','date']]},
 services:{t:'tipo de serviço',def:{dur:4},f:()=>[['name','Nome do serviço','text'],['dur','Duração padrão','select',DUR],['price','Valor padrão (R$)','number'],['obs','Observações','text']]},
 users:{t:'usuário administrativo',f:()=>[['name','Nome','text'],['email','E-mail do usuário (o mesmo do convite)','email'],['perms','Permissões de acesso','perms']]},
 ann:{t:'publicação',f:()=>[['type','Tipo','select',[['novidade','Novidade'],['alerta','Alerta'],['publicidade','Publicidade']]],['title','Título','text'],['text','Texto','textarea']]}
};
function fld(n,l,t,op,v){
 if(t==='emps')return`<fieldset><legend>${l}</legend>${D.employees.map(e=>`<label class="chk"><input type="checkbox" name="${n}" value="${e.id}" ${(v||[]).includes(e.id)?'checked':''}> ${esc(e.name)} <small>(${esc(e.role)})</small></label>`).join('')||'<small>Cadastre funcionários na aba Equipe.</small>'}</fieldset>`;
 if(t==='days')return`<fieldset><legend>${l}</legend><div class="wk">${WD.map((d,i)=>`<label class="chk"><input type="checkbox" name="${n}" value="${i}" ${(v||[]).includes(i)?'checked':''}> ${d}</label>`).join('')}</div></fieldset>`;
 if(t==='perms')return`<fieldset><legend>${l}</legend>${PERMS.map(([k,n])=>`<label class="chk"><input type="checkbox" name="perms" value="${k}" ${(v||{})[k]?'checked':''}> ${n}</label>`).join('')}<small class="mu">O painel inicial sempre fica disponível.</small></fieldset>`;
 let i;
 if(t==='select')i=`<select name="${n}"${n==='client'?' onchange="planFill(this)"':n==='service'?' onchange="svcFill(this)"':''}>${op.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
 else if(t==='textarea')i=`<textarea name="${n}" rows="3">${esc(v)}</textarea>`;
 else i=`<input name="${n}" type="${t}" value="${esc(v)}" ${t==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${['name','title','date','time','desc'].includes(n)?'required':''}>`;
 return`<label>${l}${i}</label>`}
function edit(k,id,pre){
 if(k==='appts'&&!D.clients.length)return toast('Cadastre um cliente antes de agendar.');
 const S=SCH[k],o=id?D[k].find(x=>x.id===id):{...(S.def||{}),...(pre||{})};
 $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><form class="sheet" onsubmit="return save(event,'${k}','${id||''}')"><h3>${id?'Editar':'Novo'} ${S.t}</h3>${S.f().map(([n,l,t,op])=>fld(n,l,t,op,o[n])).join('')}<div class="end"><button type="button" class="ghost" onclick="closeM()">Cancelar</button><button class="btn">Salvar</button></div></form></div>`;
 if(k==='users'&&id)$('#modal input[name=email]').readOnly=true}
const closeM=()=>$('#modal').innerHTML='';
async function save(e,k,id){
 e.preventDefault();const F=e.target,d={};
 SCH[k].f().forEach(([n,,t])=>{if(t==='emps')d[n]=[...F.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);else if(t==='days')d[n]=[...F.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>+x.value);else if(t==='perms'){d.perms={};PERMS.forEach(([k])=>d.perms[k]=!!F.querySelector('input[name="perms"][value="'+k+'"]:checked'))}else{const v=F.elements[n].value;d[n]=(t==='number'||n==='dur')?(parseFloat(v)||0):v}});
 if(k==='appts'&&!id)d.status='pending';
 if(!id)d.createdAt=TS();
 try{if(k==='users'){const em=(id||d.email||'').trim().toLowerCase();if(!em){toast('Informe o e-mail.');return false}await col(k).doc(em).set({...d,email:em,company:CID},{merge:true})}else id?await col(k).doc(id).update(d):await col(k).add(d);closeM()}catch(x){toast('Não foi possível salvar: '+x.message)}
 return false}
async function del(k,id){if(!confirm('Excluir este item?'))return;try{await col(k).doc(id).delete()}catch(x){toast(x.message)}}

/* ---------- Atendimentos ---------- */
async function done(id){
 const a=D.appts.find(x=>x.id===id),cl=D.clients.find(c=>c.id===a.client),n=cl?cl.name:'Cliente',b=db.batch(),base=`companies/${CID}/`;
 b.update(db.doc(base+'appts/'+id),{status:'done'});

 if(!U||!CO)return;
 const sc=($('main')||{}).scrollTop||0,nR=D.reqs.filter(q=>q.status==='new').length,tabs=(isAdmin?[...TABS,['admin','Admin do portal','👑','own']]:TABS).filter(t=>!t[3]||(t[3]==='own'?!STAFF:can(t[3])));
 $('#app').innerHTML=`<div class="shell ${sbc?'col':''}"><div class="top"><div class="tl"><button class="menu-btn" aria-label="Abrir menu" onclick="toggleMenu()"><i></i><i></i><i></i></button><span class="tt">Portal de Gestão</span></div><div class="tr"><span class="un">${esc(U.email)}</span><button class="pw" title="Alternar tema" aria-label="Alternar tema" onclick="toggleMode()"><span id="tmi">${isDark()?SUN:MOON}</span></button><button class="pw" title="Sair" aria-label="Sair" onclick="auth.signOut()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button></div></div><nav class="side ${mnu?'open':''}"><div class="sh">${CO.logo?`<img class="avl" src="${esc(CO.logo)}" alt="">`:`<div class="av">${esc((CO.name||'?')[0].toUpperCase())}</div>`}<div><div class="sn">${esc(CO.name)}</div><div class="sr">${isAdmin?'Administrador do portal':esc(CO.segment||'')}</div>${CO.slogan?`<div class="sr"><i>${esc(CO.slogan)}</i></div>`:''}</div></div><ul>${tabs.map(([k,l,ic])=>`<li><button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${ic}</span>${l}${k==='reqs'&&nR?`<b class="nb">${nR}</b>`:''}</button></li>`).join('')}</ul><div class="sf"><button class="ghost" onclick="auth.signOut()">Sair</button></div></nav><div class="ovl ${mnu?'on':''}" onclick="menu(false)"></div><main><div class="mi">${VIEW[tab]()}</div></main></div>`;
 const m=$('main');if(m)m.scrollTop=sc}

/* ---------- Agendamento online, solicitações e convites ---------- */
const bookLink=()=>location.origin+location.pathname+'?agendar='+CID;
function syncPublic(){if(STAFF||!CO||CO.booking===undefined)return;
 db.doc('public/'+CID).set({enabled:!!CO.booking,name:CO.name||'',slogan:CO.slogan||'',logo:CO.logo||'',logoR:CO.logoR||0,phone:CO.phone||'',palette:CO.palette||PALK,mode:CO.mode||'auto',services:D.services.map(x=>({id:x.id,name:x.name,dur:x.dur||0}))}).catch(()=>{})}
async function setBooking(v){CO={...CO,booking:v};try{await db.doc('companies/'+CID).set({booking:v},{merge:true});syncPublic()}catch(x){toast(x.message)}render()}
const copyLink=()=>navigator.clipboard.writeText(bookLink()).then(()=>toast('Link copiado.'),()=>toast('Copie o link manualmente.'));
const shareLink=()=>window.open('https://wa.me/?text='+encodeURIComponent('Agende seu serviço pelo link: '+bookLink()),'_blank');
async function approve(id){const q=D.reqs.find(x=>x.id===id),sv=D.services.find(x=>x.id===q.svc),b=db.batch(),base=`companies/${CID}/`,cr=db.collection(base+'clients').doc(),ap=db.collection(base+'appts').doc();
 b.set(cr,{name:q.name,phone:q.phone,email:q.email||'',addr:q.addr||'',kind:'',plan:'Avulso',days:[],obs:'',createdAt:TS()});
 b.set(ap,{client:cr.id,service:q.svc||'',date:q.date,time:q.time,dur:sv?sv.dur:4,emps:[],freq:'Avulso',price:sv?(sv.price||0):0,uber:0,obs:q.obs||'',status:'pending',createdAt:TS()});
 b.update(db.doc(base+'requests/'+id),{status:'approved'});
 try{await b.commit();toast('Agendado! Defina a equipe na Agenda.')}catch(x){toast(x.message)}}
async function rejectReq(id){if(!confirm('Recusar esta solicitação?'))return;try{await db.doc(`companies/${CID}/requests/${id}`).update({status:'rejected'})}catch(x){toast(x.message)}}
async function renderBooking(cid){
 $('#app').innerHTML='<div class="auth"><p class="mu">Carregando...</p></div>';
 let P=null;try{const g=await db.doc('public/'+cid).get();P=g.exists?g.data():null}catch(e){}
 if(!P||!P.enabled){$('#app').innerHTML='<div class="auth"><div class="card"><h3>Agendamento indisponível</h3><p class="mu">Esta empresa não está recebendo solicitações online no momento.</p></div></div>';return}
 BK=P;if(PAL[P.palette])PALK=P.palette;MODE=P.mode||'auto';applyTheme();
 $('#app').innerHTML=`<div class="auth"><div class="brand" style="text-align:center">${P.logo?`<img class="lg" style="margin:0 auto 8px" src="${esc(P.logo)}" alt="">`:''}<h1>${esc(P.name)}</h1><p>${esc(P.slogan||'Solicite seu agendamento')}</p></div>
 <form class="card" onsubmit="return sendReq(event,'${esc(cid)}')"><label>Seu nome<input name="name" required maxlength="80"></label><label>WhatsApp / telefone<input name="phone" type="tel" required maxlength="20"></label><label>E-mail (opcional)<input name="email" type="email" maxlength="80"></label><label>Endereço do serviço<input name="addr" required maxlength="140"></label>
 <label>Tipo de serviço<select name="svc"><option value="">A combinar</option>${(P.services||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>
 <label>Data desejada<input name="date" type="date" required min="${today()}"></label><label>Horário preferido<input name="time" type="time" value="08:30" required></label><label>Observações<textarea name="obs" rows="3" maxlength="300"></textarea></label>
 <button class="btn" style="width:100%">Enviar solicitação</button><p id="err" class="err"></p></form></div>`}
async function sendReq(e,cid){e.preventDefault();const f=new FormData(e.target),sv=(BK.services||[]).find(x=>x.id===f.get('svc')),
 d={name:f.get('name').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),addr:f.get('addr').trim(),svc:f.get('svc'),svcName:sv?sv.name:'',date:f.get('date'),time:f.get('time'),obs:f.get('obs').trim(),status:'new',createdAt:TS()};
 try{await db.collection('companies/'+cid+'/requests').add(d);$('#app').innerHTML=`<div class="auth"><div class="card"><h3>Solicitação enviada!</h3><p>${esc(BK.name)} vai entrar em contato pelo telefone informado para confirmar data e horário.</p></div></div>`}catch(x){$('#err').textContent='Não foi possível enviar. Tente novamente em instantes.'}return false}
function renderVerify(u){$('#app').innerHTML=`<div class="auth"><div class="brand"><h1>Confirme seu e-mail</h1><p>Enviamos um link de confirmação para ${esc(u.email)}. Depois de confirmar, toque em "Já confirmei".</p></div><div class="card"><button class="btn" style="width:100%" onclick="recheck()">Já confirmei</button><p></p><button class="ghost" style="width:100%" onclick="resendV()">Reenviar e-mail</button><p></p><button class="ghost" style="width:100%" onclick="auth.signOut()">Sair</button></div></div>`}
async function recheck(){try{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);boot(auth.currentUser)}catch(x){toast(x.message)}}
const resendV=async()=>{try{await auth.currentUser.sendEmailVerification();toast('E-mail reenviado.')}catch(x){toast(x.message)}};

/* ---------- Login e cadastro ---------- */
function renderAuth(){
 $('#app').innerHTML=`<div class="auth"><div class="brand"><h1>Portal de Gestão Empresarial</h1><p>Agenda, clientes, equipe e financeiro da sua empresa em um só lugar.</p></div><div id="annbox">${annHTML()}</div>
 <form class="card" onsubmit="return doAuth(event)"><div class="seg"><button type="button" class="${mode==='login'?'on':''}" onclick="mode='login';renderAuth()">Entrar</button><button type="button" class="${mode==='reg'?'on':''}" onclick="mode='reg';renderAuth()">Nova empresa</button><button type="button" class="${mode==='inv'?'on':''}" onclick="mode='inv';renderAuth()">Tenho convite</button></div>${mode==='inv'?'<p class="mu">Use o mesmo e-mail em que a empresa cadastrou você. Enviaremos um link de confirmação.</p>':''}
 ${mode==='reg'?`<label>Nome da empresa<input name="name" required></label><label>Segmento<select name="seg"><option>Limpeza residencial</option><option>Outro</option></select></label>`:''}
 <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
 <label>Senha<input name="pw" type="password" minlength="6" required autocomplete="${mode==='login'?'current-password':'new-password'}"></label>
 <label class="chk"><input type="checkbox" name="keep" checked> Manter conectado neste dispositivo</label>
 <button class="btn" style="width:100%">${mode==='login'?'Entrar':'Criar conta'}</button><p id="err" class="err"></p>
 ${mode==='login'?'<a href="#" onclick="return resetPw()">Esqueci minha senha</a>':''}</form></div>`}
async function doAuth(e){
 e.preventDefault();const f=new FormData(e.target),em=f.get('email'),pw=f.get('pw');
 try{
  await auth.setPersistence(f.get('keep')?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);
  if(mode==='login')await auth.signInWithEmailAndPassword(em,pw);
  else if(mode==='inv'){reg=true;const c=await auth.createUserWithEmailAndPassword(em,pw);let ok=false;try{ok=(await db.doc('invites/'+em.toLowerCase()).get()).exists}catch(x){}
   if(!ok){await c.user.delete();reg=false;throw{message:'Nenhum convite encontrado para este e-mail. Peça à empresa para cadastrar você em Usuários.'}}
   await c.user.sendEmailVerification();reg=false;boot(c.user)}
  else{reg=true;const c=await auth.createUserWithEmailAndPassword(em,pw);
   await db.doc('companies/'+c.user.uid).set({name:f.get('name'),segment:f.get('seg'),email:em,createdAt:TS()});reg=false;boot(c.user)}
 }catch(x){reg=false;const m=ERR[x.code]||x.message,el=$('#err');if(el)el.textContent=m;toast(m)}
 return false}
async function resetPw(){const em=document.querySelector('input[name=email]').value;if(!em){toast('Digite seu e-mail primeiro.');return false}
 try{await auth.sendPasswordResetEmail(em);toast('Enviamos um link para redefinir a senha.')}catch(x){toast(ERR[x.code]||x.message)}return false}

/* ---------- Inicialização ---------- */
async function boot(u){
 subs.forEach(f=>f());subs=[];U=u;CID=u?u.uid:null;STAFF=false;PERM={};
 Object.keys(D).forEach(k=>{if(k!=='ann')D[k]=[]});
 if(!u){CO=null;isAdmin=false;tab='home';return renderAuth()}
 let g=null;try{g=await db.doc('companies/'+u.uid).get()}catch(e){}
 if(g&&g.exists)CO=g.data();
 else{let iv=null;try{const q=await db.doc('invites/'+(u.email||'').toLowerCase()).get();if(q.exists)iv=q.data()}catch(e){}
  if(iv){if(!u.emailVerified)return renderVerify(u);STAFF=true;CID=iv.company;PERM=iv.perms||{};try{CO=(await db.doc('companies/'+CID).get()).data()||{}}catch(e){CO={}}}
  else CO={name:u.email,segment:''}}
 try{isAdmin=!STAFF&&(await db.doc('admins/'+u.uid).get()).exists}catch(e){isAdmin=false}
 if(!CO.name)CO.name=u.email;if(CO.mode)MODE=CO.mode;if(CO.palette&&PAL[CO.palette])PALK=CO.palette;ls('gm',MODE);ls('gp',PALK);applyTheme();
 const need=new Set();if(can('agenda'))['appts','reqs','clients','employees','services'].forEach(k=>need.add(k));if(can('clients'))need.add('clients');if(can('employees'))need.add('employees');if(can('services'))need.add('services');if(can('fin'))need.add('tx');
 need.forEach(k=>subs.push(col(k).onSnapshot(sn=>{D[k]=sn.docs.map(d=>({id:d.id,...d.data()}));if(k==='services')syncPublic();render()},e=>toast('Erro: '+e.message))));
 if(!STAFF)subs.push(db.collection('invites').where('company','==',CID).onSnapshot(sn=>{D.users=sn.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
 if(isAdmin)subs.push(db.collection('companies').onSnapshot(sn=>{D.cos=sn.docs.map(d=>d.data());render()}));
 render()}
db.collection('announcements').orderBy('createdAt','desc').limit(20).onSnapshot(s=>{
 D.ann=s.docs.map(d=>({id:d.id,...d.data()}));
 if(U)render();else{const b=$('#annbox');if(b)b.innerHTML=annHTML()}},()=>{});
const BOOK=new URLSearchParams(location.search).get('agendar');
if(BOOK)renderBooking(BOOK);else auth.onAuthStateChanged(u=>{if(!reg)boot(u)});
</script>
</body>
</html>
